{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block body %}
<div class="shell">
  <aside class="sidebar">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="JAK" width="120">
    <nav>
      <a class="nav active" href="{{ url_for('home') }}">Home</a>
      <span class="nav off">Stock search</span>
      <span class="nav off">Strategy search</span>
      <span class="nav off">Watchlist</span>
      <span class="nav off">Alerts</span>
      <span class="nav off">Learn</span>
      <span class="nav off">Settings</span>
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <div>
        <h1>Home</h1>
        <p class="muted">Welcome back, {{ g.user.username }}</p>
      </div>
      <form method="post" action="{{ url_for('logout') }}">
        <button class="btn btn-outline" type="submit">Log out</button>
      </form>
    </header>

    <section class="stats">
      <div class="stat-card"><p class="muted">Active strategies</p><p class="num">0</p></div>
      <div class="stat-card"><p class="muted">Signals today</p><p class="num gold">0</p></div>
      <div class="stat-card"><p class="muted">Avg. backtest accuracy</p><p class="num">&ndash;</p></div>
      <div class="stat-card"><p class="muted">Watchlist</p><p class="num">0</p></div>
    </section>
  </main>
</div>
{% endblock %}
