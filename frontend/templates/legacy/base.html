<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %} Project JAK {% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        {% block head %}{% endblock %}
    </head>
    <body>
        <div class="sidebar-container">
            <img src="{{ url_for('static', filename='images/logo.svg')}}" alt="JAK logo"/>
            <div class="sidebar-buttons-container">
                <a class="sidebar-buttons {{ 'active' if request.endpoint == 'pages.home' }}" href="{{ url_for('pages.home')}}">Home</a>
                <a class="sidebar-buttons {{ 'active' if request.endpoint == 'pages.stock_search' }}" href="{{ url_for('pages.stock_search')}}">Stock Search</a>
                <a class="sidebar-buttons {{ 'active' if request.endpoint == 'pages.strategy_search' }}" href="{{ url_for('pages.strategy_search')}}">Strategy Search</a>
                <a class="sidebar-buttons {{ 'active' if request.endpoint == 'pages.watchlist' }}" href="{{ url_for('pages.watchlist')}}">Watchlist</a>
                <a class="sidebar-buttons {{ 'active' if request.endpoint == 'pages.alerts' }}" href="{{ url_for('pages.alerts')}}">Alerts</a>
                <a class="sidebar-buttons {{ 'active' if request.endpoint == 'pages.learn' }}" href="{{ url_for('pages.learn')}}">Learn</a>
                <a class="sidebar-buttons {{ 'active' if request.endpoint == 'pages.settings' }}" href="{{ url_for('pages.settings')}}">Settings</a>
            </div>
        </div>
        <main>
            {% block content %}{% endblock %}
        </main>
        {% block scripts %}{% endblock %}
    </body>
</html>
