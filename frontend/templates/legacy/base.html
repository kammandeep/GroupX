<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %} Project JAK {% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        {% block head %}{% endblock %}
    </head>
    <body>
        <div class="sidebar-container">
            <img src="{{ url_for('static', filename='images/logo.svg')}}" alt="JAK logo"/>
            <div class="sidebar-buttons-container">
                <a class="sidebar-buttons" href="">Home</a>
                <a class="sidebar-buttons" href="">Stock Search</a>
                <a class="sidebar-buttons" href="">Stratagey Search</a>
                <a class="sidebar-buttons" href="">Watchlist</a>
                <a class="sidebar-buttons" href="">Alerts</a>
                <a class="sidebar-buttons" href="">Learn</a>
                <a class="sidebar-buttons" href="">Settings</a>
            </div>
        </div>
        <main>
            {% block content %}{% endblock %}
        </main>
        {% block scripts %}{% endblock %}
    </body>
</html>
