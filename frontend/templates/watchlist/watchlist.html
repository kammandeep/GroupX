{% extends 'base.html' %}
{% block title %}Watchlist | Project JAK{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/watchlist.css') }}">{% endblock %}

{% block content %}
<div class="watchlist">
    <header class="topbar">
      <div>
        <h1>Dashboard</h1>
        <p class="muted">Welcome back, {{ g.user.username }}</p>
      </div>
      <div class="topbar__user">
        <span class="avatar" aria-hidden="true">{{ g.user.username[0]|upper }}</span>
        <span>{{ g.user.username }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn--outline btn--small" type="submit">Log out</button>
        </form>
      </div>
    </header>
